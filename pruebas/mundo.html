<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prueba · Puerto Paquete</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8ec9f0; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; outline: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #ui > * { pointer-events: auto; }
      #info { position: fixed; left: 8px; top: 8px; z-index: 20; background: rgba(0,0,0,.6); color: #fff; font: 12px/1.4 ui-monospace, monospace; padding: 6px 8px; border-radius: 6px; white-space: pre; pointer-events: none; }
      #mapa { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: #1b1030; }
      #mapa canvas { max-width: 100vw; max-height: 100vh; image-rendering: auto; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="info">Cargando…</div>
    <div id="mapa"></div>
    <script type="module" src="/src/pruebas/mundo.ts"></script>
  </body>
</html>
