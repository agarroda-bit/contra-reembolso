<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prueba · Cielo y ciclo de día y noche</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1030; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; outline: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #ui > * { pointer-events: auto; }
      #reloj { position: fixed; top: 12px; left: 12px; z-index: 20; color: #fff; font: 800 22px/1 system-ui, sans-serif;
        background: rgba(20, 10, 40, .55); padding: 8px 12px; border-radius: 10px; letter-spacing: .5px; }
      #reloj small { display: block; font-weight: 500; font-size: 12px; opacity: .8; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="reloj">--:--<small></small></div>
    <script type="module" src="/src/pruebas/cielo.ts"></script>
  </body>
</html>
